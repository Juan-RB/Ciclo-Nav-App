    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body,
        html {
            width: 100%;

            color: #fff;
        }

        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Panel Lateral Izquierdo: Ruta */
        #left-hud {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 1000;
            width: 290px;
            max-height: calc(100% - 90px);
            background: rgba(18, 18, 18, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        /* Panel Lateral Derecho: Materiales Parada */
        #right-hud {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            width: 290px;
            max-height: calc(100% - 90px);
            background: rgba(18, 18, 18, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 152, 0, 0.4);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        /* Modal/Panel Flotante de Edición (✏️) */
        #edit-toolbar {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1100;
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid #ff9800;
            border-radius: 30px;
            padding: 8px 16px;
            display: none;
            gap: 8px;
            align-items: center;
            box-shadow: 0 8px 24px rgba(255, 152, 0, 0.3);
        }

        .edit-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 600;
        }

        .edit-btn.active {
            background: #ff9800;
            color: #000;
            border-color: #ff9800;
        }

        .hud-header {
            font-size: 1rem;
            font-weight: 700;
            color: #ff9800;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 6px;
        }

        .route-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }

        .route-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 10px;
            border-radius: 8px;
            border-left: 4px solid #888;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .route-item.here {
            border-left-color: #00E676;
            background: rgba(0, 230, 118, 0.25);
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.4);
        }

        .route-item.selected {
            border-left-color: #ff9800;
            background: rgba(255, 152, 0, 0.25);
            font-weight: bold;
        }

        .route-item-title {
            font-size: 0.85rem;
            font-weight: bold;
            color: #fff;
        }

        .route-item-sub {
            font-size: 0.75rem;
            color: #bbb;
        }

        .materials-box {
            background: rgba(255, 152, 0, 0.1);
            border: 1px dashed rgba(255, 152, 0, 0.4);
            border-radius: 10px;
            padding: 10px;
            font-size: 0.85rem;
            line-height: 1.4;
            color: #fff;
            white-space: pre-line;
            overflow-y: auto;
        }

        /* Controles Inferiores */
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            gap: 10px;
            background: rgba(18, 18, 18, 0.9);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn {
            background: #ff9800;
            color: #000;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

            background: rgba(255, 255, 255, 0.15);

        }

                right: 8px;
                top: 8px;
            }

                width: 90%;
                flex-wrap: wrap;
                justify-content: center;
            }

        function saveState() {
            undoStack.push(JSON.stringify({
                stops: stopsData,
                waypoints: routeWaypoints
            }));
            if (undoStack.length > 30) undoStack.shift();
        }

        function undoChange() {
            if (undoStack.length > 0) {
                const previousState = JSON.parse(undoStack.pop());
                stopsData = previousState.stops;
                routeWaypoints = previousState.waypoints;
                renderStops();
            } else {
                alert("No hay más acciones para deshacer.");
            }
        }

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([-33.422, -70.618], 15);

            map.createPane('userPane');
            map.getPane('userPane').style.zIndex = 1000;

            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 19,
                attribution: 'Esri'
            }).addTo(map);

            window.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                    e.preventDefault();
                    undoChange();
                }
            });

            map.on('click', (e) => {
                if (isEditingToolbarOpen && editMode === 'add-pt') {
                    saveState();
                    const newId = `D${stopsData.length + 1}`;
                    const newStop = {
                        id: newId,
                        tramo: 3,
                        name: `Punto Nuevo (${newId})`,
                        latLng: [e.latlng.lat, e.latlng.lng],
                        items: "• Materiales por definir"
                    };
                    stopsData.push(newStop);
                    renderStops();
                }
            });

            renderStops();
            selectStop("D1");
            startGPS();
        }

        function toggleEditToolbar() {
            isEditingToolbarOpen = !isEditingToolbarOpen;
            document.getElementById("edit-toolbar").style.display = isEditingToolbarOpen ? 'flex' : 'none';

        }

        function setEditMode(mode) {
            editMode = mode;
            document.querySelectorAll('.edit-btn').forEach(btn => btn.classList.remove('active'));
            if (mode === 'move-pt') document.getElementById('tool-move-pt').classList.add('active');
            if (mode === 'move-route') document.getElementById('tool-move-route').classList.add('active');
            if (mode === 'add-pt') document.getElementById('tool-add-pt').classList.add('active');
            if (mode === 'del-pt') document.getElementById('tool-del-pt').classList.add('active');
            renderStops();
        }

        function renderStops() {
            const listEl = document.getElementById("route-list");
            listEl.innerHTML = "";

            markers.forEach(m => map.removeLayer(m.marker));
            routeVectorMarkers.forEach(m => map.removeLayer(m));
            markers = [];
            routeVectorMarkers = [];

            stopsData.forEach((stop, index) => {
                const isDraggable = isEditingToolbarOpen && editMode === 'move-pt';

                const marker = L.marker(stop.latLng, {
                    draggable: isDraggable,
                    icon: L.divIcon({
                        className: 'custom-pin',
                        html: `<div style="background:${isDraggable ? '#ff9800' : '#d32f2f'}; width:14px; height:14px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 4px #000;"></div>`,
                        iconSize: [14, 14],
                        iconAnchor: [7, 7]
                    })
                }).addTo(map);

                marker.on('dragstart', () => saveState());
                marker.on('drag', (e) => {
                    const pos = e.target.getLatLng();
                    stop.latLng = [pos.lat, pos.lng];
                    updatePolylines();
                });

                marker.on('click', () => {
                    if (isEditingToolbarOpen && editMode === 'del-pt') {
                        saveState();
                        stopsData.splice(index, 1);
                        renderStops();
                    } else {
                        selectStop(stop.id);
                    }
                });

                markers.push({ id: stop.id, marker });

                const itemEl = document.createElement("div");
                itemEl.className = "route-item";
                itemEl.id = `item-${stop.id}`;
                itemEl.innerHTML = `
                    <div class="route-item-title">${stop.id}: ${stop.name}</div>
                    <div class="route-item-sub" id="sub-${stop.id}">Toca para ver descarga</div>
                `;
                itemEl.onclick = () => selectStop(stop.id);
                listEl.appendChild(itemEl);
            });

            if (isEditingToolbarOpen && editMode === 'move-route') {
                Object.keys(routeWaypoints).forEach((pairKey) => {
                    const wpList = routeWaypoints[pairKey];
                    wpList.forEach((wp, wIdx) => {
                        const wpMarker = L.marker(wp, {
                            draggable: true,
                            icon: L.divIcon({
                                className: 'vector-pin',
                                html: `<div style="background:#00E676; width:12px; height:12px; border-radius:3px; border:2px solid #000;"></div>`,
                                iconSize: [12, 12],
                                iconAnchor: [6, 6]
                            })
                        }).addTo(map);

                        wpMarker.on('dragstart', () => saveState());
                        wpMarker.on('drag', (e) => {
                            const pos = e.target.getLatLng();
                            routeWaypoints[pairKey][wIdx] = [pos.lat, pos.lng];
                            updatePolylines();
                        });

                        routeVectorMarkers.push(wpMarker);
                    });
                });
            }

            updatePolylines();
        }

        function updatePolylines() {
            lines.forEach(l => map.removeLayer(l));
            lines = [];

            const lineT1 = [];
            const lineT2 = [];
            const lineT3 = [];

            for (let i = 0; i < stopsData.length; i++) {
                const stop = stopsData[i];
                let targetLine = lineT1;
                if (stop.tramo === 2) targetLine = lineT2;
                if (stop.tramo === 3) targetLine = lineT3;

                targetLine.push(stop.latLng);

                if (i < stopsData.length - 1) {
                    const next = stopsData[i + 1];
                    const pairKey = `${stop.id}-${next.id}`;
                    if (routeWaypoints[pairKey]) {
                        routeWaypoints[pairKey].forEach(wp => targetLine.push(wp));
                    }
                }
            }

            lines.push(L.polyline(lineT1, { color: '#d32f2f', weight: 5, opacity: 0.9 }).addTo(map));
            lines.push(L.polyline(lineT2, { color: '#d32f2f', weight: 5, opacity: 0.9 }).addTo(map));
            lines.push(L.polyline(lineT3, { color: '#d32f2f', weight: 5, opacity: 0.9 }).addTo(map));
            lines.push(L.polyline([stopsData[6].latLng, stopsData[7].latLng], { color: '#d32f2f', weight: 5, opacity: 0.9 }).addTo(map));
        }

        function selectStop(id) {
            const stop = stopsData.find(s => s.id === id);
            if (!stop) return;

            document.querySelectorAll('.route-item').forEach(el => el.classList.remove('selected'));
            const selEl = document.getElementById(`item-${id}`);
            if (selEl) {
                selEl.classList.add('selected');
                selEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            document.getElementById("current-stop-code").innerText = stop.id;
            document.getElementById("stop-title").innerText = stop.name;
            document.getElementById("materials-content").innerText = stop.items;

            updateUserMarkerPosition(stop.latLng);
            map.panTo(stop.latLng);
        }

        function updateUserMarkerPosition(latLng) {
            if (!userMarker) {
                userMarker = L.circleMarker(latLng, {
                    radius: 10,
                    fillColor: '#007bff',
                    color: '#ffffff',
                    weight: 3,
                    fillOpacity: 1,
                    pane: 'userPane'
                }).addTo(map);
            } else {
                userMarker.setLatLng(latLng);
            }
        }

        function exportData() {
            const dataToExport = {
                stops: stopsData,
                waypoints: routeWaypoints
            };
            navigator.clipboard.writeText(JSON.stringify(dataToExport, null, 2));
            alert("¡Cambios de ruta y puntos copiados al portapapeles!");
        }

        function startGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (pos) => {
                        const userLatLng = [pos.coords.latitude, pos.coords.longitude];
                        document.getElementById("gps-status").innerText = "GPS Ok";
                        updateUserMarkerPosition(userLatLng);
                    },
                    () => { document.getElementById("gps-status").innerText = "Sin GPS"; },
                    { enableHighAccuracy: true }
                );
            }
        }

        function centerGPS() {
            if (userMarker) map.setView(userMarker.getLatLng(), 16);
        }

        function toggleSimulador() {
            if (simInterval) {
                clearInterval(simInterval);
                simInterval = null;
            } else {
                simIndex = 0;
                simInterval = setInterval(() => {
                    if (simIndex < stopsData.length) {
                        selectStop(stopsData[simIndex].id);
                        simIndex++;
                    } else {
                        clearInterval(simInterval);
                        simInterval = null;
                    }
                }, 2000);
            }
        }

        window.onload = initMap;
    </script>
</body>

</html>
