<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CicloNav GPS - Descarga CRVPR2</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; background: #121212; color: #fff; }
        #map { width: 100%; height: 100%; z-index: 1; }
        
        /* Panel Lateral Izquierdo: Ruta */
        #left-hud {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 1000;
            width: 290px;
            max-height: calc(100% - 90px);
            background: rgba(18, 18, 18, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        /* Panel Lateral Derecho: Materiales Parada */
        #right-hud {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            width: 290px;
            max-height: calc(100% - 90px);
            background: rgba(18, 18, 18, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 152, 0, 0.4);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        .hud-header {
            font-size: 1rem;
            font-weight: 700;
            color: #ff9800;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 6px;
        }

        .route-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }

        .route-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 10px;
            border-radius: 8px;
            border-left: 4px solid #888;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .route-item.here { 
            border-left-color: #00E676; 
            background: rgba(0, 230, 118, 0.25); 
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.4);
        }
        .route-item.selected { border-left-color: #ff9800; background: rgba(255, 152, 0, 0.25); }

        .route-item-title { font-size: 0.85rem; font-weight: bold; color: #fff; }
        .route-item-sub { font-size: 0.75rem; color: #bbb; }

        .materials-box {
            background: rgba(255, 152, 0, 0.1);
            border: 1px dashed rgba(255, 152, 0, 0.4);
            border-radius: 10px;
            padding: 10px;
            font-size: 0.85rem;
            line-height: 1.4;
            color: #fff;
            white-space: pre-line;
            overflow-y: auto;
        }

        /* Controles Inferiores */
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            gap: 10px;
            background: rgba(18, 18, 18, 0.9);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn {
            background: #ff9800;
            color: #000;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-sec { background: rgba(255, 255, 255, 0.15); color: #fff; }

        @media (max-width: 768px) {
            #left-hud { width: 170px; font-size: 0.75rem; left: 8px; top: 8px; }
            #right-hud { width: 170px; font-size: 0.75rem; right: 8px; top: 8px; }
        }
    </style>
</head>
<body>

    <!-- HUD Izquierdo: Lista de Paradas -->
    <div id="left-hud">
        <div class="hud-header">
            <span>📍 Paradas D1 - D38</span>
            <span id="gps-status" style="font-size:0.7rem; color:#4caf50;">GPS...</span>
        </div>
        <div class="route-list" id="route-list"></div>
    </div>

    <!-- HUD Derecho: Materiales a Descargar -->
    <div id="right-hud">
        <div class="hud-header">
            <span>📦 Descarga Parada</span>
            <span id="current-stop-code" style="color:#ff9800;">D1</span>
        </div>
        <div id="stop-title" style="font-size:0.85rem; font-weight:bold;">Av. El Cerro / PdV Norte</div>
        <div class="materials-box" id="materials-content">
            • 6 Conos
            • 2 Vallas "CALLE CERRADA"
            
            ⚠️ Instrucción:
            1. Colocar 1 valla en Av. El Cerro con M. Carlos Casanueva.
            2. 3 conos en diagonal detrás del camión.
        </div>
    </div>

    <div id="controls">
        <button class="btn" onclick="centerGPS()">🎯 GPS Real</button>
        <button class="btn btn-sec" onclick="toggleSimulador()">🚴 Simular Rutas</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const stopsData = [
            // TRAMO 1: Pedro de Valdivia Norte (D1 - D7)
            { id: "D1", tramo: 1, name: "Av. El Cerro / PdV Norte", latLng: [-33.41547, -70.61740], items: "• 6 Conos\n• 2 Vallas 'CALLE CERRADA'\n\n💡 Instr: 1 valla en El Cerro c/ Casanueva. 3 conos en diagonal detrás del camión." },
            { id: "D2", tramo: 1, name: "PdV Norte / Los Misioneros", latLng: [-33.41616, -70.61706], items: "• 4 Conos" },
            { id: "D3", tramo: 1, name: "PdV Norte / Los Navegantes", latLng: [-33.41687, -70.61671], items: "• 4 Conos\n• 2 Vallas 'CALLE CERRADA'" },
            { id: "D4", tramo: 1, name: "PdV Norte / El Comendador", latLng: [-33.41756, -70.61638], items: "• 4 Conos" },
            { id: "D5", tramo: 1, name: "PdV Norte / Los Conquistadores", latLng: [-33.41820, -70.61606], items: "• 8 Conos\n• 2 Vallas 'CALLE CERRADA'\n• 1 Paleta PARE" },
            { id: "D6", tramo: 1, name: "PdV Norte / Los Españoles", latLng: [-33.41911, -70.61561], items: "• 4 Conos" },
            { id: "D7", tramo: 1, name: "PdV Norte / Santa María", latLng: [-33.42003, -70.61515], items: "• 5 Conos\n• 2 Vallas 'CALLE CERRADA'\n• 1 Valla 'Usuarios / Autos'\n• 1 Paleta PARE" },

            // TRAMO 2: Andrés Bello Oriente / Subida Titanium (D8 - D24)
            { id: "D8", tramo: 2, name: "Andrés Bello / Pedro de Valdivia", latLng: [-33.42187, -70.61415], items: "• 20 Conos\n• 1 Barrera Auspicios\n• 1 Barrera CicloRecreoVía\n• 4 Vallas CALLE CERRADA\n• 1 Paleta PARE\n• 1 Tambor" },
            { id: "D9", tramo: 2, name: "Andrés Bello / Orrego Luco", latLng: [-33.42128, -70.61287], items: "• 5 Conos" },
            { id: "D10", tramo: 2, name: "Andrés Bello / Las Urbinas", latLng: [-33.42080, -70.61202], items: "• 5 Conos" },
            { id: "D11", tramo: 2, name: "Andrés Bello / A. de Fuenzalida", latLng: [-33.42026, -70.61122], items: "• 2 Conos" },
            { id: "D12", tramo: 2, name: "Andrés Bello / Ricardo Lyon", latLng: [-33.41977, -70.61054], items: "• 14 Conos\n• 1 Barrera Auspicios\n• 1 Valla CALLE CERRADA" },
            { id: "D13", tramo: 2, name: "Andrés Bello / Sta. Magdalena", latLng: [-33.41942, -70.61010], items: "• 5 Conos" },
            { id: "D14", tramo: 2, name: "Andrés Bello / General Holley", latLng: [-33.41919, -70.60982], items: "• 3 Conos" },
            { id: "D15", tramo: 2, name: "Andrés Bello / Suecia", latLng: [-33.41883, -70.60943], items: "• 14 Conos\n• 1 Barrera Auspicios\n• 1 Paleta PARE" },
            { id: "D16", tramo: 2, name: "General Holley / Bucarest", latLng: [-33.41871, -70.60931], items: "• 1 Barrera 'Calle Cerrada Sin Acceso a A. Bello'\n• 1 Barrera 'A CENCO Costanera por Suecia'" },
            { id: "D17", tramo: 2, name: "Andrés Bello / Bucarest", latLng: [-33.41853, -70.60911], items: "• 4 Conos\n• 2 Vallas CALLE CERRADA" },
            { id: "D18", tramo: 2, name: "Andrés Bello / Los Leones", latLng: [-33.41812, -70.60873], items: "• 27 Conos\n• 2 Vallas CALLE CERRADA\n• 25 Conectores\n• 1 Paleta PARE" },
            { id: "D19", tramo: 2, name: "Andrés Bello / Entrada Jumbo", latLng: [-33.41786, -70.60848], items: "• 10 Conos" },
            { id: "D20", tramo: 2, name: "Andrés Bello / Pórtico", latLng: [-33.41763, -70.60825], items: "• 10 Conos" },
            { id: "D21", tramo: 2, name: "Andrés Bello / Escultura", latLng: [-33.41724, -70.60788], items: "• 10 Conos" },
            { id: "D22", tramo: 2, name: "Andrés Bello / Nueva Tobalaba", latLng: [-33.41658, -70.60728], items: "• 22 Conos\n• 2 Vallas CALLE CERRADA\n• 1 Valla Usuario/Auto\n• 1 Paleta PARE" },
            { id: "D23", tramo: 2, name: "Andrés Bello / Nueva Tajamar", latLng: [-33.41588, -70.60660], items: "• 32 Conos\n• 1 Barrera Desvío\n• 1 Barrera Calle Cerrada\n• 1 Barrera Dirección\n• 2 Vallas CALLE CERRADA\n• 1 Valla Usuarios/Autos" },
            { id: "D24", tramo: 2, name: "Andrés Bello / Entrada Caletera (Titanium)", latLng: [-33.41475, -70.60551], items: "• 16 Conos\n• 1 Valla Máxima 40\n• 1 Valla Desvío 100M\n• 2 Barreras" },

            // TRAMO 3: Andrés Bello Bajada / Cardenal Caro (D25 - D38)
            { id: "D25", tramo: 3, name: "Andrés Bello / Francisco Noguera", latLng: [-33.42226, -70.61535], items: "• 24 Conos\n• 3 Vallas CALLE CERRADA\n• 10 Conectores" },
            { id: "D26", tramo: 3, name: "Andrés Bello / M. Sótero Sánz", latLng: [-33.42263, -70.61612], items: "• 20 Conos" },
            { id: "D27", tramo: 3, name: "Andrés Bello / La Concepción", latLng: [-33.42288, -70.61773], items: "• 12 Conos\n• 1 Barrera Auspicios\n• 1 Paleta PARE" },
            { id: "D28", tramo: 3, name: "Andrés Bello / Padre Mariano", latLng: [-33.42347, -70.61926], items: "• 5 Conos\n• 1 Valla CALLE CERRADA" },
            { id: "D29", tramo: 3, name: "Andrés Bello / Antonio Bellet", latLng: [-33.42421, -70.62061], items: "• 7 Conos\n• 1 Valla CALLE CERRADA\n\n💡 Cerrar salida sur y armar curva en calzada norte." },
            { id: "D30", tramo: 3, name: "Andrés Bello / Gral. Calderón", latLng: [-33.42663, -70.62221], items: "• 4 Conos\n• 1 Barrera Auspicios\n• 1 Valla CALLE CERRADA" },
            { id: "D31", tramo: 3, name: "Andrés Bello / Almte. Pastene", latLng: [-33.42813, -70.62272], items: "• 4 Conos" },
            { id: "D32", tramo: 3, name: "Andrés Bello / Manuel Montt", latLng: [-33.42954, -70.62388], items: "• 3 Conos" },
            { id: "D33", tramo: 3, name: "Andrés Bello / Pérez Valenzuela", latLng: [-33.43074, -70.62489], items: "• 2 Conos\n• 1 Barrera CicloRecreoVía" },
            { id: "D34", tramo: 3, name: "Andrés Bello / Huelén", latLng: [-33.43222, -70.62626], items: "• 26 Conos\n• 3 Barreras CicloRecreoVía\n• 3 Vallas CALLE CERRADA" },
            { id: "D35", tramo: 3, name: "Andrés Bello / Pte. Arzobispo", latLng: [-33.43433, -70.62924], items: "• 8 Conos\n• 2 Vallas CALLE CERRADA" },
            { id: "D36", tramo: 3, name: "Andrés Bello / Pío Nono", latLng: [-33.43631, -70.63537], items: "• 15 Conos\n• 2 Vallas CALLE CERRADA\n• 1 Paleta PARE" },
            { id: "D37", tramo: 3, name: "J.M. Caro / Purísima", latLng: [-33.43569, -70.63834], items: "• 14 Conos\n• 2 Vallas CALLE CERRADA" },
            { id: "D38", tramo: 3, name: "J.M. Caro / J.M. de la Barra", latLng: [-33.43467, -70.64281], items: "• 6 Conos\n• 1 Barrera FIN CICLORECREOVIA" }
        ];

        let map, userMarker, markers = [];
        let simInterval = null, simIndex = 0;
        let currentActiveStopId = null;

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([-33.420, -70.612], 14);
            
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 19,
                attribution: 'Esri'
            }).addTo(map);

            renderStops();
            selectStop("D1");
            startGPS();
        }

        function renderStops() {
            const listEl = document.getElementById("route-list");
            listEl.innerHTML = "";

            // Trazado dividido en 3 polígonos independientes para eliminar diagonales cruzadas
            const lineTramo1 = [];
            const lineTramo2 = [];
            const lineTramo3 = [];

            stopsData.forEach((stop) => {
                if (stop.tramo === 1) lineTramo1.push(stop.latLng);
                if (stop.tramo === 2) lineTramo2.push(stop.latLng);
                if (stop.tramo === 3) lineTramo3.push(stop.latLng);

                const marker = L.circleMarker(stop.latLng, {
                    radius: 7,
                    fillColor: '#d32f2f',
                    color: '#fff',
                    weight: 2,
                    fillOpacity: 0.9
                }).addTo(map);

                marker.on('click', () => selectStop(stop.id));
                markers.push({ id: stop.id, marker });

                const itemEl = document.createElement("div");
                itemEl.className = "route-item";
                itemEl.id = `item-${stop.id}`;
                itemEl.innerHTML = `
                    <div class="route-item-title">${stop.id}: ${stop.name}</div>
                    <div class="route-item-sub" id="sub-${stop.id}">Toca para ver descarga</div>
                `;
                itemEl.onclick = () => selectStop(stop.id);
                listEl.appendChild(itemEl);
            });

            // Dibujar las 3 secciones continuas por separado
            L.polyline(lineTramo1, { color: '#d32f2f', weight: 5, opacity: 0.9 }).addTo(map);
            L.polyline(lineTramo2, { color: '#d32f2f', weight: 5, opacity: 0.9 }).addTo(map);
            L.polyline(lineTramo3, { color: '#d32f2f', weight: 5, opacity: 0.9 }).addTo(map);
        }

        function selectStop(id) {
            const stop = stopsData.find(s => s.id === id);
            if (!stop) return;

            document.querySelectorAll('.route-item').forEach(el => {
                if (!el.classList.contains('here')) el.classList.remove('selected');
            });

            const selEl = document.getElementById(`item-${id}`);
            if (selEl && !selEl.classList.contains('here')) {
                selEl.classList.add('selected');
                selEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            document.getElementById("current-stop-code").innerText = stop.id;
            document.getElementById("stop-title").innerText = stop.name;
            document.getElementById("materials-content").innerText = stop.items;

            // Mueve el punto azul de ubicación al punto seleccionado
            if (!userMarker) {
                userMarker = L.circleMarker(stop.latLng, { radius: 9, fillColor: '#1976d2', color: '#fff', weight: 3, fillOpacity: 1 }).addTo(map);
            } else {
                userMarker.setLatLng(stop.latLng);
            }

            checkProximity(stop.latLng);
            map.panTo(stop.latLng);
        }

        function checkProximity(userLatLng) {
            stopsData.forEach((stop) => {
                const dist = map.distance(userLatLng, stop.latLng);
                const markerObj = markers.find(m => m.id === stop.id);
                const itemEl = document.getElementById(`item-${stop.id}`);
                const subEl = document.getElementById(`sub-${stop.id}`);

                if (dist <= 40) {
                    if (markerObj) {
                        markerObj.marker.setStyle({
                            fillColor: '#00E676',
                            color: '#ffffff',
                            radius: 11,
                            fillOpacity: 1
                        });
                    }
                    if (itemEl) {
                        itemEl.classList.add('here');
                        if (subEl) subEl.innerText = "📍 ESTÁS AQUÍ";
                    }
                    if (currentActiveStopId !== stop.id) {
                        currentActiveStopId = stop.id;
                    }
                } else {
                    if (markerObj) {
                        markerObj.marker.setStyle({
                            fillColor: '#d32f2f',
                            color: '#ffffff',
                            radius: 7,
                            fillOpacity: 0.9
                        });
                    }
                    if (itemEl) {
                        itemEl.classList.remove('here');
                        if (subEl && subEl.innerText === "📍 ESTÁS AQUÍ") {
                            subEl.innerText = "Toca para ver descarga";
                        }
                    }
                }
            });
        }

        function startGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (pos) => {
                        const userLatLng = [pos.coords.latitude, pos.coords.longitude];
                        document.getElementById("gps-status").innerText = "GPS Ok";

                        if (!userMarker) {
                            userMarker = L.circleMarker(userLatLng, { radius: 9, fillColor: '#1976d2', color: '#fff', weight: 3, fillOpacity: 1 }).addTo(map);
                        } else {
                            userMarker.setLatLng(userLatLng);
                        }

                        checkProximity(userLatLng);
                    },
                    () => { document.getElementById("gps-status").innerText = "Sin GPS"; },
                    { enableHighAccuracy: true }
                );
            }
        }

        function centerGPS() {
            if (userMarker) map.setView(userMarker.getLatLng(), 16);
        }

        function toggleSimulador() {
            if (simInterval) {
                clearInterval(simInterval);
                simInterval = null;
            } else {
                simIndex = 0;
                simInterval = setInterval(() => {
                    if (simIndex < stopsData.length) {
                        selectStop(stopsData[simIndex].id);
                        simIndex++;
                    } else {
                        clearInterval(simInterval);
                        simInterval = null;
                    }
                }, 2000);
            }
        }

        window.onload = initMap;
    </script>
</body>
</html>
